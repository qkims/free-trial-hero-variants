    <style>
      /* ================================================================
         Variant 2 — mobile (iPhone 16, 393×852) — Figma node 257:14151

         The desktop spinning photo wheel (node 61:6815), re-laid-out for
         the narrow mobile frame: header bar, the same card wheel arcing
         across the top (same idle-drift + scroll + grab/flick motion), a
         white intro card overlapping the arc, then the shared email card.

         Authored at 393 design px (--u == one design px at 393 wide) so it
         fills the phone frame; the wheel geometry is tuned so ~3 cards read
         across the top arc exactly as in the mock.
      ================================================================= */
      html,
      body {
        margin: 0;
        background: #fff;
      }

      .m2-hero {
        position: relative;
        width: 100%;
        /* Full mobile frame: the photo arc sits at the top and the white intro +
           black CTA are pinned to the bottom of the viewport (built by
           mobile-extras.js as one persistent .m-sticky unit, like the world
           variant). The in-hero .m2-stack is hidden in favour of that bar. */
        aspect-ratio: 393 / 852;
        overflow: hidden;
        background: #fff;
        container-type: inline-size;
        --u: 0.254453cqw; /* 100/393 cqw */
        /* Wheel geometry (mobile design px). Arc apex = cy − r; set so the
           ~3-card row sits high but its TOP edge clears the 72u white header
           bar (apex ≈ 175 → card top ≈ 83). Higher than this and the opaque
           header crops the photo tops; lower and the arc reads as "too low". */
        --r: 700; /* rim radius */
        --cy: 875; /* rotation-centre y; apex (cy − r) ≈ 175 */
        cursor: grab;
        touch-action: pan-y;
      }
      .m2-hero.is-dragging {
        cursor: grabbing;
      }

      /* ---- Header bar / logo bar (72px, centered animated mark) ---- */
      .m2-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: calc(72 * var(--u));
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 5;
      }

      .m2-header .shopify-logo {
        height: calc(72 * var(--u));
        width: auto;
        display: block;
      }

      /* ---- Spinning photo wheel (identical mechanism to desktop) ---- */
      .m2-wheel-anchor {
        position: absolute;
        left: 50%;
        top: calc(var(--cy) * var(--u));
        width: 0;
        height: 0;
        transform: translateX(-50%);
        z-index: 0;
      }

      .m2-wheel {
        position: absolute;
        width: 0;
        height: 0;
        will-change: transform;
      }

      /* Each card is centred on the wheel origin, rotated to its base angle
         --a, then pushed to the rim by translateY(-r) — so it sits at angle a
         on the circle, tilted tangentially, exactly like the fanned comp. */
      .m2-card {
        position: absolute;
        left: calc(-67 * var(--u)); /* half of 134 */
        top: calc(-92.5 * var(--u)); /* half of 185 */
        width: calc(134 * var(--u));
        height: calc(185 * var(--u));
        border-radius: calc(16 * var(--u));
        overflow: hidden;
        background: #eee;
        transform: rotate(var(--a)) translateY(calc(var(--r) * var(--u) * -1));
      }

      .m2-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Soft white wash over the top of the arc, fading down. */
      .m2-topwash {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: calc(180 * var(--u));
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.85) 0%,
          rgba(255, 255, 255, 0.5) 40%,
          rgba(255, 255, 255, 0) 100%
        );
      }

      /* ---- Centre content stack (intro card + email CTA) ---------- */
      .m2-stack {
        position: absolute;
        z-index: 3;
        left: 50%;
        /* Sits just below the arc so the frosted intro overlaps the bottom of
           the photo cards (like desktop); the black CTA follows directly under
           it. apex ≈ 150 → cards bottom ≈ 242, so 210 gives a clean overlap. */
        top: calc(210 * var(--u));
        transform: translateX(-50%);
        width: calc(361 * var(--u));
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: calc(10 * var(--u));
      }

      /* Frosted-glass intro card — translucent white that blurs the photo
         arc behind it instead of a solid fill (sizes kept in --u so the look
         tracks the rest of the card system). */
      .m2-intro {
        background: rgba(255, 255, 255, 0.44);
        /* Match the black CTA card's corner radius (35u) below it. */
        border-radius: calc(35 * var(--u));
        padding: calc(28 * var(--u)) calc(24 * var(--u));
        box-shadow: 0 calc(4 * var(--u)) calc(30 * var(--u)) rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(calc(10.6 * var(--u)));
        -webkit-backdrop-filter: blur(calc(10.6 * var(--u)));
        border: calc(1 * var(--u)) solid rgba(255, 255, 255, 0.57);
      }

      /* T1 heading: 36/38, -0.18 — left-aligned in the card */
      .m2-headline {
        margin: 0;
        font-weight: 300;
        font-size: calc(36 * var(--u));
        line-height: calc(38 * var(--u));
        letter-spacing: calc(-0.18 * var(--u));
        color: #000;
        font-feature-settings: "ss03" 1;
      }

      .m2-subhead {
        margin: calc(12 * var(--u)) 0 0;
        font-weight: 400;
        font-size: calc(15 * var(--u));
        line-height: calc(21 * var(--u));
        letter-spacing: calc(-0.09 * var(--u));
        color: rgba(0, 0, 0, 0.6);
        font-feature-settings: "ss03" 1;
      }

      .m2-subhead strong {
        font-weight: 500;
        color: #000;
      }
    </style>
  </head>

                  d="M-16.177,15.598c0,0,.388-8.535,5.875-18.234c3.686-6.516,9.31-12.304,15.407-12.914c4.105-.41,7.383,1.815,8.924,5.376c1.607,3.713,2.604,8.868,1.939,14.965"
                  paint-order="stroke fill markers"
                  fill="none"
                  fill-rule="evenodd"
                  stroke="#fff"
                  stroke-width="4"
                  stroke-miterlimit="10"
                ></path>
              </g>
            </g>
          </g>
        </svg>
      </header>

      <!-- Spinning wheel of merchant photo cards (decorative) -->
      <div class="m2-wheel-anchor" aria-hidden="true">
        <div class="m2-wheel" id="m2-wheel"></div>
      </div>

      <div class="m2-topwash" aria-hidden="true"></div>

      <!-- Centre content -->
      <div class="m2-stack">
        <div class="m2-intro ft-in-white">
          <h1 class="m2-headline">Your business<br />starts with Shopify</h1>
          <p class="m2-subhead">
            Try 3 days free, then <strong>$1/month for 3 months.</strong> What
            are you waiting for?
          </p>
        </div>

        <form class="signup-card ft-in-black" action="#" method="post">
          <div class="signup-card__label">
            <span class="signup-card__cta">Start for free</span>
            <p class="signup-card__disclaimer">
              You agree to receive Shopify marketing emails.
            </p>
          </div>
          <div class="signup-card__field">
            <input
              class="signup-card__email"
              type="email"
              name="email"
              placeholder="Enter your email"
              aria-label="Enter your email"
            />
            <button
              class="signup-card__submit"
              type="submit"
              aria-label="Start your free trial"
            >
              <svg
                class="signup-card__arrow"
                viewBox="0 0 23.475 22"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M12.475 22L10.184 19.709L14.0913 15.8174C14.4679 15.4513 14.8497 15.0799 15.2368 14.7033C15.6343 14.3267 16.0371 13.9501 16.4451 13.5735C16.8531 13.1864 17.2558 12.8098 17.6534 12.4437C18.0613 12.0775 18.4589 11.7218 18.8459 11.3766L19.0813 12.4907C18.6419 12.5117 18.1712 12.5378 17.669 12.5692C17.1774 12.5901 16.6752 12.611 16.1626 12.632C15.65 12.6529 15.1479 12.6633 14.6562 12.6633H0V9.33666H14.6562C15.1479 9.33666 15.65 9.34712 16.1626 9.36805C16.6752 9.38897 17.1774 9.40989 17.669 9.43081C18.1712 9.45174 18.6419 9.47789 19.0813 9.50927L18.8459 10.6391C18.3333 10.1788 17.805 9.70281 17.2611 9.21113C16.7171 8.70899 16.1783 8.20685 15.6448 7.70471C15.1113 7.19211 14.5934 6.68997 14.0913 6.19829L10.184 2.3067L12.475 0L23.475 11L12.475 22Z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </div>
        </form>
      </div>
    </section>

    <script>
      // Same photo set + order as desktop V2 (Figma 358:22237 → assets/fan/).
      // No hover state on mobile (touch); just the new photos in the new order.
      const WHEEL_PHOTOS = [
        "fan01.png", // 1 — denim, holding box (MoEA)
        "fan02.png", // 2 — phone shooting bottles
        "fan03.png", // 3 — storefront (YOWIE)
        "fan04.png", // 4 — "Ask anything" avatar
        "fan05.png", // 5 — laptop in chair (Hutch Cassidy)
        "fan06.png", // 6 — Shopify product page
        "fan07.png", // 7 — in shop (NOMAD)
        "fan08.png", // 8 — colorful duck product
        "fan09.png", // 9 — two people, storefront (Labour and Wait)
        "fan10.png", // 10 — POS tablet
      ];

      // Cards sit STEP degrees apart around the rim. 30 cards = 12° apart —
      // the tighter spacing that read best; the wider 15°/18° fans pushed the
      // photos too far apart across the top.
      const N = 30;
      const STEP = 360 / N; // 12° — the tighter spacing that read best
      let html = "";
      for (let i = 0; i < N; i++) {
        const angle = i * STEP;
        const file = WHEEL_PHOTOS[i % WHEEL_PHOTOS.length];
        html +=
          `<div class="m2-card" style="--a:${angle}deg">` +
          `<img src="assets/fan/${file}" alt="" />` +
          `</div>`;
      }
      const wheel = document.getElementById("m2-wheel");
      wheel.innerHTML = html;

      // ---- Rotation engine (identical to desktop V2) -----------------
      (function () {
        const hero = document.querySelector(".m2-hero");
        const reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        if (reduce) {
          wheel.style.transform = "rotate(0deg)";
          return;
        }

        const IDLE_VEL = -2; // deg/sec — gentle constant resting drift (left)
        const DEG_PER_PX = 0.08; // added rotation per px of vertical scroll
        const SMOOTH = 0.12; // ease toward target each frame
        const SENSITIVITY = 0.32; // deg of rotation per px dragged
        const FRICTION = 2.2; // per-second decay of flick velocity
        const FLING_MAX = 1400; // clamp flick speed (deg/sec)

        let baseAngle = 0;
        let dragAngle = 0;
        let renderAngle = 0;
        let flingVel = 0;
        let dragging = false;
        let lastX = 0;
        let lastT = 0;
        let lastMove = 0;

        const scrollAngle = () => -window.scrollY * DEG_PER_PX;

        let prev = null;
        function frame(t) {
          if (prev === null) prev = t;
          const dt = Math.min((t - prev) / 1000, 0.05);
          prev = t;

          baseAngle += IDLE_VEL * dt;

          if (!dragging && flingVel !== 0) {
            const k = Math.exp(-FRICTION * dt);
            flingVel *= k;
            if (Math.abs(flingVel) < 1) flingVel = 0;
            dragAngle += flingVel * dt;
          }

          const target = baseAngle + scrollAngle() + dragAngle;
          renderAngle += (target - renderAngle) * SMOOTH;
          wheel.style.transform = `rotate(${renderAngle}deg)`;
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        function onDown(e) {
          if (e.target.closest(".m2-stack")) return;
          dragging = true;
          flingVel = 0;
          lastX = e.clientX;
          lastT = performance.now();
          lastMove = lastT;
          hero.classList.add("is-dragging");
          hero.setPointerCapture?.(e.pointerId);
        }

        function onMove(e) {
          if (!dragging) return;
          const now = performance.now();
          const dx = e.clientX - lastX;
          const dPhi = dx * SENSITIVITY;
          dragAngle += dPhi;

          const dt = (now - lastT) / 1000;
          if (dt > 0) {
            flingVel = Math.max(-FLING_MAX, Math.min(FLING_MAX, dPhi / dt));
          }
          lastX = e.clientX;
          lastT = now;
          lastMove = now;
        }

        function onUp(e) {
          if (!dragging) return;
          dragging = false;
          hero.classList.remove("is-dragging");
          hero.releasePointerCapture?.(e.pointerId);
          if (performance.now() - lastMove > 80) flingVel = 0;
        }

        hero.addEventListener("pointerdown", onDown);
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      })();
    </script>
    <div id="below-hero"></div>
    <script src="mobile-extras.js?v=7"></script>
  </body>
