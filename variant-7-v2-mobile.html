    <style>
      /* ----------------------------------------------------------------
       Variant 7 — mobile (Scattered)

       Same design and motion as the desktop hero, reflowed to the 393×852
       mobile frame: a centered message stack (white "intro" card holding the
       heading + subhead, above the dark email CTA card) framed by the same
       seven merchant photos, here re-scattered into a top band and a bottom
       band so they bleed off the portrait edges instead of the sides. The
       photos parallax on pointer move exactly as on desktop — one shared
       --px/--py offset scaled per photo by its own depth --d — while the
       stack holds still so the copy stays readable. The logo is overlaid on
       a transparent top strip so the top photos bleed up to the very edge.

       Authored at 393 × 852, everything in cqw (--u == one design px at 393
       wide) so it scales to fill the phone frame.
    ---------------------------------------------------------------- */
      html,
      body {
        margin: 0;
        background: #fff;
      }

      .m7-hero {
        position: relative;
        width: 100%;
        aspect-ratio: 393 / 852;
        overflow: hidden;
        background: #fff;
        container-type: inline-size;
        --u: 0.254453cqw; /* 100/393 cqw */
      }

      /* ---- Logo overlaid on a transparent top strip (photos bleed to its
         sides and up to the very top edge, per the desktop comp) ---- */
      .m7-logo {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(72 * var(--u));
      }
      /* Soft white halo behind the logo so the mark stays legible over the
         photo that bleeds up to the top edge behind it. */
      .m7-logo::before {
        content: "";
        position: absolute;
        left: 50%;
        top: calc(36 * var(--u));
        transform: translate(-50%, -50%);
        width: calc(300 * var(--u));
        height: calc(120 * var(--u));
        z-index: -1;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.96) 0%,
          rgba(255, 255, 255, 0.72) 32%,
          rgba(255, 255, 255, 0) 72%
        );
      }
      .m7-logo .shopify-logo {
        height: calc(72 * var(--u));
        width: auto;
        display: block;
      }

      /* ---- Static photo collage (v2). Six merchant cards scattered across
         the portrait hero at fixed positions — NO downward drift. Every card
         is sharp (no depth blur); depth is conveyed by size and how far each
         card slides with the pointer (--d × the shared --px/--py offset). A
         card flips (rotateY) to reveal its named "hover" face — on pointer
         hover in the desktop harness, and on tap (the .is-flipped class) on a
         real touch device. */
      .m7-field {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
      }
      /* Each card carries the parallax translate; the perspective makes the
         inner flip read as real 3D. */
      .m7-card {
        position: absolute;
        perspective: calc(900 * var(--u));
        transform: translate3d(
          calc(var(--px, 0px) * var(--d, 0)),
          calc(var(--py, 0px) * var(--d, 0)),
          0
        );
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.4s ease,
          opacity 0.4s ease;
        will-change: transform;
        cursor: pointer;
      }
      /* While one card is focused (hovered in the harness, or tapped on touch),
         the others recede — softly blurred and dimmed. */
      .m7-field:has(.m7-card:hover) .m7-card:not(:hover),
      .m7-field:has(.m7-card.is-flipped) .m7-card:not(.is-flipped) {
        filter: blur(calc(4 * var(--u)));
        opacity: 0.55;
      }
      .m7-flip {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }
      /* Flip + slight zoom on hover (harness) or tap (.is-flipped). */
      .m7-card:hover {
        z-index: 9;
      }
      .m7-card:hover .m7-flip,
      .m7-card.is-flipped .m7-flip {
        transform: rotateY(180deg) scale(1.06);
      }
      .m7-card.is-flipped {
        z-index: 9;
      }
      /* Faces share the card box. PNG exports carry rounded corners + alpha,
         so the shadow uses drop-shadow (follows the alpha shape). */
      .m7-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .m7-face img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        border-radius: calc(16 * var(--u));
        filter: drop-shadow(
          0 calc(14 * var(--u)) calc(24 * var(--u)) rgba(0, 0, 0, 0.3)
        );
      }
      .m7-face.back {
        transform: rotateY(180deg);
      }

      /* ---- Bottom-anchored message stack ----
         Pinned to the bottom of the hero (per the live shopify.com/free-trial
         mobile layout); holds the white "intro" card above the dark email CTA
         card. Sits above the photos (z 5) so it masks any photo edge behind it
         and keeps the copy legible. The flowing field fills the space above. */
      .m7-stack {
        position: absolute;
        z-index: 5;
        left: calc(20 * var(--u));
        right: calc(20 * var(--u));
        /* Raised so the white intro's BOTTOM clears the top of the bottom-pinned
           black CTA bar — previously the box bottom sat behind the black card,
           so the white showed through around it. Now it rests just above with a
           small gap. The black card is moved out of this stack into the fixed
           bar by mobile-extras.js, leaving only the white intro to scroll up. */
        bottom: calc(218 * var(--u));
        display: flex;
        flex-direction: column;
        gap: calc(10 * var(--u));
      }
      .m7-stack .signup-card {
        width: 100%;
        max-width: none;
      }

      /* Disclaimer pulled out of the dark card — fine print just below it.
         The stack is bottom-anchored over the flowing photo field, so the
         text is white with a soft shadow to stay legible over the imagery. */
      .signup-card__disclaimer--out {
        margin: calc(8 * var(--u)) 0 0;
        padding: 0 calc(8 * var(--u));
        text-align: center;
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 calc(1 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, 0.55);
      }

      /* White "intro" card: heading + subhead, with the comp's soft layered
         drop shadow. */
      .m7-intro {
        background: #fff;
        border-radius: calc(28 * var(--u));
        padding: calc(26 * var(--u)) calc(22 * var(--u)) calc(24 * var(--u));
        box-shadow:
          0 calc(9 * var(--u)) calc(20 * var(--u)) rgba(0, 0, 0, 0.05),
          0 calc(36 * var(--u)) calc(36 * var(--u)) rgba(0, 0, 0, 0.04),
          0 calc(82 * var(--u)) calc(49 * var(--u)) rgba(0, 0, 0, 0.03),
          0 0 calc(2 * var(--u)) rgba(0, 0, 0, 0.25);
      }
      /* T1 heading: 33/35, -0.33 — weight 500 (Inter Medium) */
      .m7-headline {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin: 0;
        font-weight: 500;
        font-size: calc(33 * var(--u));
        line-height: calc(35 * var(--u));
        letter-spacing: calc(-0.33 * var(--u));
        color: #000;
        font-feature-settings: "ss03" 1;
      }
      /* Body base: 15/19, -0.15 */
      .m7-subhead {
        margin: calc(10 * var(--u)) 0 0;
        font-weight: 400;
        font-size: calc(15 * var(--u));
        line-height: calc(19 * var(--u));
        letter-spacing: calc(-0.15 * var(--u));
        color: rgba(0, 0, 0, 0.6);
        font-feature-settings: "ss03" 1;
      }
      /* The mid clause is emphasized in black, per the comp. */
      .m7-subhead strong {
        font-weight: 400;
        color: #000;
      }
    </style>

    <!-- Static collage + pointer parallax. No drift in v2: the only motion is
         the pointer offset (--px/--py), set once on the field, with each card
         adding its depth (--d) share on top. Cards flip to their named face on
         hover (desktop harness) or tap (.is-flipped, real touch). Parallax is
         disabled under prefers-reduced-motion. -->
    <script>
      (function () {
        var hero = document.querySelector(".m7-hero");
        var field = document.getElementById("m7-field");
        if (!field) return;
        var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        var A = "assets/v7-v2/";
        var DW = 393,
          DH = 852; // design frame the positions below are authored in
        // Six merchant cards scattered across the single portrait hero, biased
        // to the upper ~two-thirds so all stay visible above the bottom-pinned
        // CTA bar. x/y = card-centre fraction of the frame (0..1); w = card
        // width in design px; ar = image natural aspect (h/w); d = parallax
        // depth. Each card has a front face (photo) and a back face (the named
        // "hover" image). Ordered back-to-front (ascending d) so closer cards
        // layer on top.
        var CARDS = [
          { x: 0.24, y: 0.42, w: 182, ar: 0.595, d: 0.32, img: "eastfork" },
          // Larger + pushed into the top-left edge (slightly cropped).
          { x: 0.18, y: 0.15, w: 178, ar: 1.417, d: 0.42, img: "hutch" },
          // Slightly smaller.
          { x: 0.74, y: 0.15, w: 132, ar: 1.382, d: 0.5, img: "jitensha" },
          // Larger.
          { x: 0.33, y: 0.66, w: 158, ar: 1.911, d: 0.62, img: "yowie" },
          // Smaller + pushed off the right edge (slightly cropped).
          { x: 0.86, y: 0.44, w: 134, ar: 1.382, d: 0.7, img: "moea" },
          { x: 0.72, y: 0.68, w: 182, ar: 0.687, d: 0.86, img: "labour" },
        ];
        function u(n) {
          return "calc(" + n.toFixed(2) + " * var(--u))";
        }
        CARDS.forEach(function (c, i) {
          var h = c.w * c.ar;
          var card = document.createElement("div");
          card.className = "m7-card";
          card.style.setProperty("--d", c.d);
          card.style.width = u(c.w);
          card.style.height = u(h);
          card.style.left = u(DW * c.x - c.w / 2);
          card.style.top = u(c.y * DH - h / 2);

          var flip = document.createElement("div");
          flip.className = "m7-flip";
          var front = document.createElement("div");
          front.className = "m7-face front";
          var back = document.createElement("div");
          back.className = "m7-face back";

          var fi = new Image();
          fi.alt = "";
          fi.decoding = "async";
          fi.loading = "eager";
          if (i < 3) fi.fetchPriority = "high";
          fi.src = A + c.img + ".png";
          front.appendChild(fi);

          var bi = new Image();
          bi.alt = "";
          bi.decoding = "async";
          bi.loading = "eager"; // preload so the flip never reveals a blank face
          bi.src = A + c.img + "-hover.png";
          back.appendChild(bi);

          flip.appendChild(front);
          flip.appendChild(back);
          card.appendChild(flip);

          // Tap to flip on touch devices (no hover). Tapping another card flips
          // this one back, so only one card is ever flipped at a time.
          card.addEventListener("click", function () {
            var open = field.querySelector(".m7-card.is-flipped");
            if (open && open !== card) open.classList.remove("is-flipped");
            card.classList.toggle("is-flipped");
          });

          field.appendChild(card);
        });

        // Pointer parallax: one shared offset on the field; each card scales it
        // by its own depth (--d). This is the only motion — no downward drift.
        if (!reduce) {
          var AMP = 26;
          var raf = 0,
            px = 0,
            py = 0;
          function applyP() {
            raf = 0;
            field.style.setProperty("--px", px.toFixed(2) + "px");
            field.style.setProperty("--py", py.toFixed(2) + "px");
          }
          function schedule() {
            if (!raf) raf = requestAnimationFrame(applyP);
          }
          hero.addEventListener("pointermove", function (e) {
            var r = hero.getBoundingClientRect();
            px = -(((e.clientX - r.left) / r.width - 0.5) * 2 * AMP);
            py = -(((e.clientY - r.top) / r.height - 0.5) * 2 * AMP);
            schedule();
          });
          hero.addEventListener("pointerleave", function () {
            px = 0;
            py = 0;
            schedule();
          });
        }
      })();
    </script>
    <div id="below-hero"></div>
    <script src="mobile-extras.js?v=7"></script>
  </body>
