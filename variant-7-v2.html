    <style>
      /* ================================================================
         Variant 7 — reference Figma node 325:14199 ("Hero"). A white hero
         with a centered message stack (a white "intro" card holding the
         heading + subhead, above a dark email CTA card) framed by seven
         merchant photos placed at their exact comp positions (node
         325:14200, "Group 24467"). The photos parallax on pointer move —
         each shifts by an amount set by its own depth, so the layers slide
         against one another — while the stack holds still so the copy stays
         readable. Authored at 1440 × 673; every dim is a cqw unit
         (--u == one design px) so it scales with the viewport. */

      /* Logo overlaid at the top on a transparent strip, so the corner
         photos bleed up to the very top edge to the logo's sides, per the
         comp (the hero is the full frame incl. the 72px header band). */
      .v7-logo {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(72 * var(--u));
      }
      /* Soft white halo behind the logo so the mark stays legible where the
         photos bleed up behind it. Sits below the SVG (z-index:-1) but inside
         the logo's stacking context, so it's above the photo field. */
      .v7-logo::before {
        content: "";
        position: absolute;
        left: 50%;
        top: calc(36 * var(--u));
        transform: translate(-50%, -50%);
        width: calc(380 * var(--u));
        height: calc(132 * var(--u));
        z-index: -1;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.95) 0%,
          rgba(255, 255, 255, 0.7) 32%,
          rgba(255, 255, 255, 0) 72%
        );
      }
      .v7-logo .shopify-logo {
        height: calc(72 * var(--u));
        width: auto;
        display: block;
      }

      .v7-hero {
        position: relative;
        width: 100%;
        aspect-ratio: 1440 / 673;
        overflow: hidden;
        background: #fff;
        container-type: inline-size;
        --u: 0.069444cqw; /* 100/1440 cqw */
      }

      /* ---- Static photo collage (v2). Six merchant cards scattered across
         the hero at fixed positions — NO downward drift. Every card is sharp
         (no depth blur); depth is conveyed purely by size and how far each
         card slides with the pointer. On pointer move every card shifts by its
         depth (--d) times the shared pointer offset (--px/--py), so the layers
         slide against one another — this is the only motion. Hovering a card
         lifts/zooms it and flips it (rotateY) to reveal its "hover" face: the
         merchant's named back image. */
      .v7-field {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 0;
      }
      /* Each card is an absolutely-positioned box that carries the parallax
         translate; a perspective here makes the inner flip read as real 3D. */
      .v7-card {
        position: absolute;
        perspective: calc(1200 * var(--u));
        transform: translate3d(
          calc(var(--px, 0px) * var(--d, 0)),
          calc(var(--py, 0px) * var(--d, 0)),
          0
        );
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.4s ease,
          opacity 0.4s ease;
        will-change: transform;
        cursor: pointer;
      }
      /* While one card is hovered (flipping), the others recede — softly
         blurred and dimmed so the focused card stands out. */
      .v7-field:has(.v7-card:hover) .v7-card:not(:hover) {
        filter: blur(calc(4 * var(--u)));
        opacity: 0.55;
      }
      /* The flipper holds the two faces and rotates + zooms on hover. */
      .v7-flip {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .v7-card:hover {
        z-index: 9;
      }
      .v7-card:hover .v7-flip {
        transform: rotateY(180deg) scale(1.06);
      }
      /* Faces share the card box. The PNG exports already carry rounded
         corners + alpha, so the shadow uses drop-shadow (which follows the
         alpha shape) rather than a box-shadow on a rectangle. */
      .v7-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .v7-face img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        border-radius: calc(16 * var(--u));
        filter: drop-shadow(
          0 calc(24 * var(--u)) calc(38 * var(--u)) rgba(0, 0, 0, 0.28)
        );
        transition: filter 0.45s ease;
      }
      .v7-card:hover .v7-face img {
        filter: drop-shadow(
          0 calc(34 * var(--u)) calc(54 * var(--u)) rgba(0, 0, 0, 0.34)
        );
      }
      /* Back face is pre-rotated so it reads correctly once the flip lands. */
      .v7-face.back {
        transform: rotateY(180deg);
      }

      /* ---- Centered message stack (reference node 325:14209) ----
         Transparent positioned wrapper pinned at the comp position (490,
         212), 460 wide; holds the white "intro" card above the dark email
         CTA card. Sits above the photos (z 5) so it masks any inner photo
         edge and keeps the copy legible. */
      .v7-stack {
        position: absolute;
        z-index: 5;
        left: calc(490 * var(--u));
        top: calc(212 * var(--u));
        width: calc(460 * var(--u));
        display: flex;
        flex-direction: column;
        gap: calc(10 * var(--u)); /* Stack gap */
      }
      /* The signup card fills the stack width. */
      .v7-stack .signup-card {
        width: 100%;
      }

      /* White "intro" card: heading + subhead, with the comp's soft layered
         drop shadow. */
      .v7-intro {
        background: #fff;
        border-radius: calc(35 * var(--u));
        padding: calc(30 * var(--u)) calc(24 * var(--u)) calc(25 * var(--u))
          calc(20 * var(--u));
        box-shadow:
          0 calc(9 * var(--u)) calc(20 * var(--u)) rgba(0, 0, 0, 0.05),
          0 calc(36 * var(--u)) calc(36 * var(--u)) rgba(0, 0, 0, 0.04),
          0 calc(82 * var(--u)) calc(49 * var(--u)) rgba(0, 0, 0, 0.03),
          0 calc(145 * var(--u)) calc(58 * var(--u)) rgba(0, 0, 0, 0.01),
          0 0 calc(2 * var(--u)) rgba(0, 0, 0, 0.25);
      }

      .v7-headline {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin: 0;
        font-weight: 500; /* Inter Medium */
        font-size: calc(44 * var(--u));
        line-height: 1;
        letter-spacing: calc(-0.44 * var(--u));
        color: #000;
        font-feature-settings: "ss03" 1;
      }
      .v7-headline span {
        white-space: nowrap;
      }

      .v7-subhead {
        margin: calc(10 * var(--u)) 0 0;
        font-weight: 400;
        font-size: calc(18 * var(--u));
        line-height: 1.2;
        letter-spacing: calc(-0.18 * var(--u));
        color: rgba(0, 0, 0, 0.6);
        font-feature-settings: "ss03" 1;
      }
      /* The mid clause is emphasized in black, per the comp. */
      .v7-subhead strong {
        font-weight: 400;
        color: #000;
      }
    </style>

    <!-- Static collage + pointer parallax. There is no drift in v2: the only
         motion is the pointer offset (--px/--py), set once on the field, with
         every card adding its depth (--d) share on top so the layers slide
         against one another. Each card flips to its named face on hover.
         Parallax is disabled under prefers-reduced-motion. -->
    <script>
      (function () {
        var hero = document.querySelector(".v7-hero");
        var field = document.getElementById("v7-field");
        if (!field) return;
        var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        var A = "assets/v7-v2/";
        var DW = 1440,
          DH = 673; // design frame the positions below are authored in
        // Six merchant cards scattered across the single hero frame. x/y =
        // card-centre fraction of the frame (0..1); w = card width in design
        // px; ar = image natural aspect (h/w); d = parallax depth (how far the
        // card slides with the pointer). Each card has a front face (the photo)
        // and a back face (the named "hover" image) revealed by the flip.
        // Ordered back-to-front (ascending d) so closer cards layer on top.
        var CARDS = [
          { x: 0.16, y: 0.84, w: 250, ar: 0.595, d: 0.3, img: "eastfork" },
          // Larger + pushed into the top-left edge (slightly cropped).
          { x: 0.075, y: 0.27, w: 236, ar: 1.417, d: 0.4, img: "hutch" },
          // Slightly smaller.
          { x: 0.87, y: 0.29, w: 176, ar: 1.382, d: 0.5, img: "jitensha" },
          // Larger.
          { x: 0.3, y: 0.66, w: 202, ar: 1.911, d: 0.62, img: "yowie" },
          // Smaller + pushed off the right edge (slightly cropped).
          { x: 0.95, y: 0.7, w: 166, ar: 1.382, d: 0.7, img: "moea" },
          { x: 0.7, y: 0.86, w: 250, ar: 0.687, d: 0.85, img: "labour" },
        ];
        function u(n) {
          return "calc(" + n.toFixed(2) + " * var(--u))";
        }
        CARDS.forEach(function (c, i) {
          var h = c.w * c.ar;
          var card = document.createElement("div");
          card.className = "v7-card";
          card.style.setProperty("--d", c.d);
          card.style.width = u(c.w);
          card.style.height = u(h);
          card.style.left = u(DW * c.x - c.w / 2);
          card.style.top = u(c.y * DH - h / 2);

          // Inner flipper holds the two faces; rotateY on hover (CSS) reveals
          // the back. Front = photo, back = named "hover" image.
          var flip = document.createElement("div");
          flip.className = "v7-flip";
          var front = document.createElement("div");
          front.className = "v7-face front";
          var back = document.createElement("div");
          back.className = "v7-face back";

          var fi = new Image();
          fi.alt = "";
          fi.decoding = "async";
          fi.loading = "eager";
          // First few front faces get high fetch priority for LCP.
          if (i < 3) fi.fetchPriority = "high";
          else fi.fetchPriority = "low";
          // Right-sized WebP + density srcset.
          fi.src = A + c.img + ".webp";
          fi.srcset = A + c.img + ".webp 1x, " + A + c.img + "@2x.webp 2x";
          front.appendChild(fi);

          var bi = new Image();
          bi.alt = "";
          bi.decoding = "async";
          bi.loading = "lazy"; // hover back-face: only needed on flip
          bi.fetchPriority = "low";
          bi.src = A + c.img + "-hover.webp";
          bi.srcset = A + c.img + "-hover.webp 1x, " + A + c.img + "-hover@2x.webp 2x";
          back.appendChild(bi);

          flip.appendChild(front);
          flip.appendChild(back);
          card.appendChild(flip);
          field.appendChild(card);
        });

        // Pointer parallax: one shared offset on the field; each card scales it
        // by its own depth (--d), so the layers slide against one another. This
        // is the only motion — there is no downward drift in v2.
        if (!reduce) {
          var AMP = 34;
          var raf = 0,
            px = 0,
            py = 0;
          function applyP() {
            raf = 0;
            field.style.setProperty("--px", px.toFixed(2) + "px");
            field.style.setProperty("--py", py.toFixed(2) + "px");
          }
          function schedule() {
            if (!raf) raf = requestAnimationFrame(applyP);
          }
          hero.addEventListener("pointermove", function (e) {
            var r = hero.getBoundingClientRect();
            px = -(((e.clientX - r.left) / r.width - 0.5) * 2 * AMP);
            py = -(((e.clientY - r.top) / r.height - 0.5) * 2 * AMP);
            schedule();
          });
          hero.addEventListener("pointerleave", function () {
            px = 0;
            py = 0;
            schedule();
          });
        }
      })();
    </script>
    <script src="shared-below.js?v=3"></script>
